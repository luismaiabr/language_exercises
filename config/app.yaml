app:
  name: "German Exercise Platform"
  version: "1.0.0"
  description: "AI-driven German language exercise generation & evaluation platform"
  environment: "development"

server:
  host: "0.0.0.0"
  port: 8000
  reload: true
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:5173"
    - "http://127.0.0.1:3000"
  timeout_seconds: 30

magic_links:
  timespan_days: 7
  base_url: "http://localhost:5173/lesson"

courses:
  default_course_name: "German Theory"
  auto_provision_inactive: true
  instant_dispatch: false
  allowed_exercise_types:
    - "multiple_choice"
    - "written"
